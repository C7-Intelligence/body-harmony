name: Refresh regulatory news feed
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'peptide-guide-v2/feed-sources.json'
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/build_feed.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peptide-guide-v2/js/feed.js
          git diff --cached --quiet || (git commit -m "Refresh regulatory news feed [skip ci]" && git push)

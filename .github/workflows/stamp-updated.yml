name: Stamp page last-updated dates
on:
  push:
    branches: [main]
    paths:
      - 'peptide-guide-v2/js/data/**'
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/stamp_updated.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peptide-guide-v2/js/updated.js peptide-guide-v2/js/updated-state.json
          git diff --cached --quiet || (git commit -m "Update page last-updated dates [skip ci]" && git push)
